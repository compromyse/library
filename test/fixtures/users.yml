# password for all users is "password"
caseworker:
  name: Case Worker
  email: caseworker@example.com
  password_digest: <%= BCrypt::Password.create("password", cost: 4) %>
  admin: false
  status: approved

admin:
  name: Admin User
  email: admin@example.com
  password_digest: <%= BCrypt::Password.create("password", cost: 4) %>
  admin: true
  status: approved

pending:
  name: Pending User
  email: pending@example.com
  password_digest: <%= BCrypt::Password.create("password", cost: 4) %>
  admin: false
  status: pending

denied:
  name: Denied User
  email: denied@example.com
  password_digest: <%= BCrypt::Password.create("password", cost: 4) %>
  admin: false
  status: denied
